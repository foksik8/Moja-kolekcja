<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#222"><link rel="manifest" href="manifest.json"><title>Moja Kolekcja</title><style>
body{font-family:system-ui;margin:0;background:#f3f3f3;color:#222}header{background:#222;color:#fff;padding:16px}main{max-width:900px;margin:auto;padding:14px}button{padding:10px 14px;border:0;border-radius:9px;background:#222;color:#fff;margin:3px}.active{background:#666}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card,form,.item{background:white;padding:14px;border-radius:12px;margin:10px 0}.card b{display:block;font-size:23px}input,select,textarea{width:100%;padding:10px;margin:5px 0 10px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{display:flex;justify-content:space-between}.danger{background:#a22}.buy{background:#375d2b}.hide{display:none}@media(max-width:600px){.cards,.grid{grid-template-columns:1fr 1fr}.item{display:block}}
.cover{width:70px;height:70px;object-fit:cover;border-radius:8px;margin-right:10px}.row{display:flex;align-items:center}.scanbox{background:#111;color:#fff;padding:12px;border-radius:12px;margin:10px 0}.scanbox video{width:100%;border-radius:10px;max-height:280px;object-fit:cover}.muted{color:#666;font-size:13px}.apiresult{background:#fff;border-radius:12px;padding:10px;margin:8px 0}.apiresult img{width:60px;height:60px;object-fit:cover;border-radius:7px;vertical-align:middle;margin-right:8px}
</style>
<header><main><h1>🎵📚 Moja Kolekcja</h1>CD • Kasety • Książki</main></header><main>
<nav><button class="active" onclick="tab('c',this)">📦 Kolekcja</button><button onclick="tab('w',this)">🛒 Do kupienia</button><button onclick="tab('b',this)">💾 Kopia</button></nav>
<section id="c"><div class="cards"><div class="card">💿<b id="cd">0</b>CD</div><div class="card">📼<b id="ka">0</b>kaset</div><div class="card">📚<b id="ks">0</b>książek</div><div class="card">🛒<b id="wc">0</b>do kupienia</div></div><input id="q" placeholder="🔎 Szukaj...">
<form id="f"><h2>➕ Dodaj</h2><div class="grid"><label>Rodzaj<select id="t"><option>CD</option><option>Kaseta</option><option>Książka</option></select></label><label>Tytuł<input id="ti" required></label><label>Kod kreskowy / ISBN<input id="bc" inputmode="numeric"><button type="button" onclick="startScan()">📷 Skanuj kod</button> <button type="button" onclick="lookupBarcode()">🔎 Uzupełnij z kodu</button></label><label>Wykonawca / autor<input id="cr"></label><label>Rok<input id="yr" type="number"></label><label>Wydawnictwo<input id="pu"></label><label>Gatunek<input id="ge"></label><label>Stan<select id="co"><option>Bardzo dobry</option><option>Dobry</option><option>Średni</option><option>Słaby</option></select></label></div><label>Notatka<textarea id="no"></textarea></label><button>💾 Zapisz</button><input id="cover" type="hidden"><p id="apiMsg" class="muted"></p><div id="scanArea" class="hide scanbox"><video id="scanner" playsinline></video><button type="button" onclick="stopScan()">✕ Zamknij skaner</button></div></form><div id="list"></div></section>
<section id="w" class="hide"><h2>🛒 Do kupienia</h2><form id="wf"><div class="grid"><label>Rodzaj<select id="wt"><option>CD</option><option>Kaseta</option><option>Książka</option></select></label><label>Tytuł<input id="wti" required></label><label>Wykonawca / autor<input id="wcr"></label><label>Rok<input id="wyr" type="number"></label><label>Maks. cena (€)<input id="wp" type="number"></label><label>Priorytet<select id="pr"><option>⭐⭐⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐</option><option>⭐</option></select></label></div><button>🛒 Dodaj</button></form><input id="wq" placeholder="🔎 Szukaj na liście..."><div id="wl"></div></section>
<section id="b" class="hide"><h2>💾 Kopia danych</h2><button onclick="exp()">⬇️ Eksportuj</button><button onclick="document.querySelector('#imp').click()">⬆️ Importuj</button><input id="imp" type="file" accept=".json" style="display:none"><p id="mig"></p></section></main>
<script>
const $=x=>document.getElementById(x),K='moja_kolekcja_data_v3';let d=[],w=[],mig='';
const clean=x=>({id:x.id||Date.now()+Math.random(),type:x.type||'CD',title:x.title||'',creator:x.creator||'',year:x.year||'',publisher:x.publisher||'',genre:x.genre||'',condition:x.condition||'Bardzo dobry',notes:x.notes||'',barcode:x.barcode||'',cover:x.cover||'',sourceId:x.sourceId||''});
function load(){let a=localStorage.getItem(K);if(a){try{let o=JSON.parse(a);d=(o.collection||[]).map(clean);w=o.wanted||[]}catch(e){}}else{try{d=JSON.parse(localStorage.getItem('mk_collection')||'[]').map(clean);w=JSON.parse(localStorage.getItem('mk_wanted')||'[]');if(d.length||w.length){mig='Automatycznie przeniesiono dane ze starszej wersji. Pole Regał/Lokalizacja nie zostało przeniesione.';save()}}catch(e){}}}
function save(){localStorage.setItem(K,JSON.stringify({version:3,collection:d,wanted:w}));render()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){cd.textContent=d.filter(x=>x.type=='CD').length;ka.textContent=d.filter(x=>x.type=='Kaseta').length;ks.textContent=d.filter(x=>x.type=='Książka').length;wc.textContent=w.length;let z=q.value.toLowerCase();list.innerHTML=d.filter(x=>(x.title+' '+x.creator+' '+x.genre).toLowerCase().includes(z)).map(x=>`<div class=item><div class=row>${x.cover?`<img class=cover src="${esc(x.cover)}" loading="lazy" onerror="this.style.display='none'">`:''}<div><b>${esc(x.title)}</b><br>${esc(x.type)} • ${esc(x.creator)} ${x.year?'• '+x.year:''}<br>${esc(x.genre)} ${x.barcode?'• '+esc(x.barcode):''}</div></div><button class=danger onclick="del(${x.id})">Usuń</button></div>`).join('')||'<p>Brak pozycji.</p>';let y=wq.value.toLowerCase();wl.innerHTML=w.filter(x=>(x.title+' '+x.creator).toLowerCase().includes(y)).map(x=>`<div class=item><div><b>${esc(x.title)}</b><br>${esc(x.type)} • ${esc(x.creator)} ${x.year?'• '+x.year:''}<br>${x.prio||'⭐⭐⭐'} ${x.price?'• max '+x.price+' €':''}</div><div><button onclick="search(${x.id})">🔎 Szukaj</button><button class=buy onclick="buy(${x.id})">✓ Kupione</button><button class=danger onclick="dw(${x.id})">Usuń</button></div></div>`).join('')||'<p>Lista pusta.</p>';mig&&( $('mig').textContent=mig)}
f.onsubmit=e=>{e.preventDefault();d.push(clean({type:t.value,title:ti.value,creator:cr.value,year:yr.value,publisher:pu.value,genre:ge.value,condition:co.value,notes:no.value,barcode:bc.value}));e.target.reset();save()}
wf.onsubmit=e=>{e.preventDefault();w.push({id:Date.now(),type:wt.value,title:wti.value,creator:wcr.value,year:wyr.value,price:wp.value,prio:pr.value});e.target.reset();save()}
function del(i){d=d.filter(x=>x.id!=i);save()}function dw(i){w=w.filter(x=>x.id!=i);save()}function search(i){let x=w.find(a=>a.id==i);location.href='https://www.google.com/search?q='+encodeURIComponent([x.title,x.creator,x.year,x.type,'kupić'].filter(Boolean).join(' '))}
function buy(i){let x=w.find(a=>a.id==i);d.push(clean(x));w=w.filter(a=>a.id!=i);save();tab('c',document.querySelector('nav button'))}
function tab(i,b){['c','w','b'].forEach(x=>$(x).classList.toggle('hide',x!=i));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
let scanStream=null,scanTimer=null;
async function startScan(){
  if(!('BarcodeDetector' in window)){alert('Twój Chrome nie udostępnia skanera kodów w tej wersji. Możesz wpisać kod ręcznie.');return}
  try{
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
    scanArea.classList.remove('hide');
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    scanner.srcObject=scanStream; await scanner.play();
    const loop=async()=>{if(!scanStream)return;try{const codes=await det.detect(scanner);if(codes.length){bc.value=codes[0].rawValue;stopScan();await lookupBarcode();return}}catch(e){}scanTimer=setTimeout(loop,350)};loop();
  }catch(e){stopScan();alert('Nie udało się uruchomić aparatu. Sprawdź zgodę na używanie aparatu dla Chrome.');}
}
function stopScan(){if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}scanner.srcObject=null;scanArea.classList.add('hide')}
async function lookupBarcode(){
  const code=(bc.value||'').replace(/[^0-9Xx]/g,''); if(!code)return;
  apiMsg.textContent='🔎 Szukam informacji dla kodu '+code+'…';
  try{
    if(t.value==='Książka' && (code.length===10||code.length===13)){
      const r=await fetch('https://openlibrary.org/isbn/'+encodeURIComponent(code)+'.json');
      if(r.ok){const b=await r.json();
        ti.value=b.title||ti.value; cr.value=(b.authors||[]).map(a=>a.name).join(', ')||cr.value;
        yr.value=(b.publish_date||'').match(/(\d{4})/)?.[1]||yr.value; pu.value=(b.publishers||[])[0]?.name||pu.value;
        cover.value='https://covers.openlibrary.org/b/isbn/'+encodeURIComponent(code)+'-M.jpg';
        apiMsg.textContent='✅ Dane książki uzupełnione. Sprawdź je i kliknij Zapisz.';return;
      }
    }
    const url='https://musicbrainz.org/ws/2/release/?query='+encodeURIComponent('barcode:'+code)+'&fmt=json&limit=5';
    const r=await fetch(url,{headers:{'Accept':'application/json'}}); if(!r.ok)throw new Error('API'); const j=await r.json();
    if(j.releases?.length){const x=j.releases[0];ti.value=x.title||ti.value;cr.value=(x['artist-credit']||[]).map(a=>a.name||a.artist?.name).join(', ')||cr.value;yr.value=(x.date||'').slice(0,4)||yr.value;pu.value=(x['label-info']||[])[0]?.label?.name||pu.value;ge.value=(x['release-group']?.['primary-type'])||ge.value;const mb=x.id;if(mb)cover.value='https://coverartarchive.org/release/'+mb+'/front-250';apiMsg.textContent='✅ Dane wydania znalezione. Sprawdź je i kliknij Zapisz.';return;}
    apiMsg.textContent='Nie znalazłem tego kodu. Możesz uzupełnić dane ręcznie.';
  }catch(e){apiMsg.textContent='Nie udało się pobrać danych. Sprawdź internet albo wpisz dane ręcznie.'}
}
function exp(){let a=document.createElement('a'),b=new Blob([JSON.stringify({version:3,collection:d,wanted:w},null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='moja_kolekcja_backup.json';a.click()}
imp.onchange=e=>{let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);d=(o.collection||[]).map(clean);w=o.wanted||[];save();alert('Zaimportowano')}catch{alert('Błędny plik')}};r.readAsText(e.target.files[0])}
q.oninput=wq.oninput=render;load();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></html>
