<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#222">
<link rel="manifest" href="manifest.json">
<title>Moja Kolekcja</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#090d0b;--panel:#151b17;--panel2:#1c241e;--line:#344238;--text:#e5e8e3;--muted:#9ba69d;--red:#8e252b;--red2:#b13b3d;--green:#435b47;--silver:#b9c2bb}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:radial-gradient(ellipse at 50% 0%,#263329 0%,#111914 34%,var(--bg) 78%);background-attachment:fixed;color:var(--text);min-height:100vh}
header{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(4,8,6,.78),rgba(10,15,11,.96)),radial-gradient(ellipse at 50% 10%,#52604e 0%,#202b22 38%,#090d0b 82%);border-bottom:1px solid #465447;padding:24px 16px 22px;box-shadow:0 8px 28px #0009}
header:before{content:"";position:absolute;inset:0;opacity:.3;background:repeating-linear-gradient(82deg,transparent 0 28px,#82908022 29px 30px,transparent 31px 55px),linear-gradient(0deg,#050806 0%,transparent 68%);pointer-events:none}
header main{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px}header .brand-logo{display:block;width:min(100%,760px);height:auto;max-height:230px;object-fit:contain;filter:drop-shadow(0 4px 12px #000)}header main div{color:#aab5aa;letter-spacing:1.5px;text-transform:uppercase;font-size:11px;text-align:center}
main{max-width:900px;margin:auto;padding:14px}
h1,h2{margin-top:0}h2{font-family:Georgia,serif;letter-spacing:1px;color:#d7ded7;text-transform:uppercase;font-size:21px}
h3{color:#d8ded8;font-family:Georgia,serif;letter-spacing:.5px}
button{padding:11px 14px;border:1px solid #4b5a4e;border-radius:7px;background:linear-gradient(180deg,#344238,#202a23);color:#f0f2ed;margin:3px;cursor:pointer;font:inherit;font-weight:600;box-shadow:inset 0 1px #ffffff12,0 2px 5px #0006}
button:active{transform:translateY(1px)}button.secondary{background:#303833;border-color:#59635b}.danger{background:linear-gradient(180deg,#9a3438,#5d191e);border-color:#a64a4d}.buy{background:linear-gradient(180deg,#52694c,#2d422f);border-color:#637c60}
input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid #465349;border-radius:7px;background:#0d130f;color:var(--text);font:inherit;accent-color:#9b3338}input::placeholder,textarea::placeholder{color:#778279}
label{color:#c4cdc5;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{position:relative;overflow:hidden;min-height:112px;background:linear-gradient(145deg,#202a23,#101612 72%);color:#e2e8e1;border:1px solid #465548;border-left:3px solid #7d292e;font-size:16px;text-align:left;padding:14px;border-radius:8px;box-shadow:inset 0 1px #ffffff0a,0 5px 12px #0007}
.menu button:after{content:"";position:absolute;width:90px;height:130px;right:-24px;bottom:-65px;border-left:1px solid #77877935;border-right:1px solid #77877925;transform:rotate(34deg);pointer-events:none}
.menu button b{display:block;font-size:29px;margin-bottom:7px;filter:grayscale(.65)}.menu button small{display:block;color:#9eaaa0;font-size:12px;margin-top:4px}
#home>h2{margin:8px 2px 14px;padding-left:10px;border-left:3px solid #8e3035}
.card,form,.item,.panel{background:linear-gradient(145deg,#1a221c,#111713);border:1px solid #344137;padding:14px;border-radius:9px;margin:10px 0;box-shadow:0 5px 16px #0005}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;border-left:3px solid #596b59}
.row{display:flex;align-items:center;min-width:0}.cover{width:82px;height:100px;object-fit:cover;border-radius:5px;margin-right:10px;flex-shrink:0;border:1px solid #59645b;box-shadow:0 3px 9px #0008}.itemtext{min-width:0;overflow-wrap:anywhere}.itemtext b{color:#e4e8e2}.itemactions{display:flex;flex-wrap:wrap;gap:4px}
.muted{color:var(--muted);font-size:13px}.hide{display:none!important}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}.topbar button{margin:0}.section-title{display:flex;justify-content:space-between;align-items:center}
.scanbox{background:#080c09;color:#fff;padding:12px;border:1px solid #475449;border-radius:9px;margin:10px 0}.scanbox video{width:100%;border-radius:7px;max-height:300px;object-fit:cover}
.apiresult{background:#172019;border:1px solid #3a4a3d;border-radius:9px;padding:10px;margin:8px 0}.count{font-size:13px;color:#9ba69d}
.panel{scroll-margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#151d17;border:1px solid #465448;border-left:3px solid #8e3035;border-radius:8px;padding:13px}.stat strong{display:block;font-size:25px;color:#f0f2ed}.stat small{color:#aab5aa}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end}.toolbar label{flex:1 1 140px}.toolbar select{margin-bottom:4px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}.gallery .item{display:block;padding:10px;min-width:0}.gallery .row{display:block}.gallery .cover{display:block;width:100%;height:175px;margin:0 0 9px}.gallery .itemactions button{font-size:12px;padding:8px}.gallery .itemtext{font-size:13px}.gallery .itemtext small{font-size:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}.item{display:block}.item>div:last-child{margin-top:8px}.menu button{min-height:100px}}
</style>
</head>
<body>
<header><main><img class="brand-logo" src="logo-metal.png?v=17" alt="Moja Kolekcja – leśny logotyp metalowy"><div>Muzyka • literatura • mroczny las</div></main></header>
<main>

<section id="home">
  <h2>Menu główne</h2>
  <div class="menu">
    <button onclick="openSection('cds')"><b>💿</b>CD <small id="mcd">0 pozycji</small></button>
    <button onclick="openSection('tapes')"><b>📼</b>Kasety <small id="mka">0 pozycji</small></button>
    <button onclick="openSection('books')"><b>📚</b>Książki <small id="mks">0 pozycji</small></button>
    <button onclick="openSection('wanted')"><b>🛒</b>Do kupienia <small id="mw">0 pozycji</small></button>
    <button onclick="openSection('scanner')"><b>📷</b>Skaner <small>kod kreskowy / ISBN</small></button>
    <button onclick="openSection('search')"><b>🔎</b>Wyszukiwanie <small>cała kolekcja</small></button>
    <button onclick="openSection('backup')"><b>💾</b>Kopia zapasowa <small>eksport / import</small></button>
    <button onclick="openSection('stats')"><b>📊</b>Statystyki <small>podsumowanie kolekcji</small></button>
  </div>
</section>

<section id="stats" class="hide"></section>
<section id="cds" class="hide"></section>
<section id="tapes" class="hide"></section>
<section id="books" class="hide"></section>
<section id="wanted" class="hide"></section>

<section id="scanner" class="hide">
  <div class="topbar"><button onclick="goHome()">← Menu</button><h2>📷 Skaner</h2></div>
  <div class="panel">
    <p>Skanuj kod kreskowy płyty, kasety lub ISBN książki.</p>
    <label>Rodzaj
      <select id="scanType"><option>CD</option><option>Kaseta</option><option>Książka</option></select>
    </label>
    <label>Kod kreskowy / ISBN
      <input id="scanCode" inputmode="numeric" placeholder="np. 978... lub 509974...">
    </label>
    <button onclick="startScan()">📷 Uruchom aparat</button>
    <button class="secondary" onclick="lookupBarcode()">🔎 Szukaj po kodzie</button>
    <p id="scanMsg" class="muted"></p>
    <div id="scanArea" class="hide scanbox">
      <video id="scannerVideo" playsinline></video>
      <button type="button" onclick="stopScan()">✕ Zamknij skaner</button>
    </div>
  </div>
  <div id="scanResult"></div>
</section>

<section id="search" class="hide">
  <div class="topbar"><button onclick="goHome()">← Menu</button><h2>🔎 Wyszukiwanie</h2></div>
  <input id="globalQ" placeholder="Szukaj tytułu, autora, wykonawcy, gatunku lub kodu...">
  <div id="globalList"></div>
</section>

<section id="backup" class="hide">
  <div class="topbar"><button onclick="goHome()">← Menu</button><h2>💾 Kopia zapasowa</h2></div>
  <div class="panel">
    <p>Eksport zapisuje całą kolekcję i listę „Do kupienia” do pliku.</p>
    <button onclick="exp()">⬇️ Eksportuj</button>
    <button onclick="document.querySelector('#imp').click()">⬆️ Importuj</button>
    <input id="imp" type="file" accept=".json" style="display:none">
    <p id="mig" class="muted"></p>
  </div>
</section>

</main>

<script>
const $=id=>document.getElementById(id);
const K='moja_kolekcja_data_v3';
let d=[],w=[],currentType='CD',scanStream=null,scanTimer=null;

function clean(x){
 return {id:x.id||Date.now()+Math.random(),type:x.type||'CD',title:x.title||'',creator:x.creator||'',
 year:x.year||'',publisher:x.publisher||'',genre:x.genre||'',condition:x.condition||'Bardzo dobry',
 notes:x.notes||'',barcode:x.barcode||'',cover:x.cover||'',sourceId:x.sourceId||''};
}
function load(){
 let a=localStorage.getItem(K);
 if(a){try{let o=JSON.parse(a);d=(o.collection||[]).map(clean);w=o.wanted||[]}catch(e){}}
 else{
  try{d=JSON.parse(localStorage.getItem('mk_collection')||'[]').map(clean);
      w=JSON.parse(localStorage.getItem('mk_wanted')||'[]');
      if(d.length||w.length)save();}
  catch(e){}
 }
}
function save(){localStorage.setItem(K,JSON.stringify({version:7,collection:d,wanted:w}));renderMenu()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function goHome(){
 document.querySelectorAll('main>section').forEach(s=>s.classList.add('hide'));
 $('home').classList.remove('hide');
 stopScan();
}
function openSection(id){
 document.querySelectorAll('main>section').forEach(s=>s.classList.add('hide'));
 $(id).classList.remove('hide');
 if(['cds','tapes','books'].includes(id)) renderCollectionSection(id);
 if(id==='stats') renderStats();
 if(id==='wanted') renderWanted();
 if(id==='search') renderGlobal();
}
function renderMenu(){
 $('mcd').textContent=d.filter(x=>x.type==='CD').length+' pozycji';
 $('mka').textContent=d.filter(x=>x.type==='Kaseta').length+' pozycji';
 $('mks').textContent=d.filter(x=>x.type==='Książka').length+' pozycji';
 $('mw').textContent=w.length+' pozycji';
}
function renderStats(){
 const cd=d.filter(x=>x.type==='CD').length,ka=d.filter(x=>x.type==='Kaseta').length,ks=d.filter(x=>x.type==='Książka').length;
 const covers=d.filter(x=>Boolean(x.cover)).length;
 const years=d.map(x=>parseInt(x.year,10)).filter(x=>Number.isFinite(x)&&x>0).sort((a,b)=>a-b);
 $('stats').innerHTML=`<div class="topbar"><button onclick="goHome()">← Menu</button><h2>📊 Statystyki</h2></div><div class="stats">
 <div class="stat"><strong>${d.length}</strong><small>Wszystkie pozycje</small></div><div class="stat"><strong>${cd}</strong><small>Płyty CD</small></div><div class="stat"><strong>${ka}</strong><small>Kasety</small></div><div class="stat"><strong>${ks}</strong><small>Książki</small></div><div class="stat"><strong>${covers}</strong><small>Pozycje z okładką</small></div><div class="stat"><strong>${w.length}</strong><small>Do kupienia</small></div></div>
 <div class="panel"><h3>📅 Lata wydań</h3>${years.length?'Najstarszy: '+years[0]+' • Najnowszy: '+years[years.length-1]:'Brak podanych lat wydania.'}</div>`;
}
function itemForm(type){
 currentType=type;
 return `<div class="panel">
 <h3>➕ Dodaj ${esc(type)}</h3>
 <form onsubmit="addItem(event,'${type}')">
 <div class="grid">
 <label>Tytuł<input id="ntitle" required></label>
 <label>Wykonawca / autor<input id="ncreator"></label>
 <label>Rok<input id="nyear" type="number"></label>
 <label>Wydawnictwo<input id="npub"></label>
 <label>Gatunek<input id="ngenre"></label>
 <label>Stan<select id="ncondition"><option>Bardzo dobry</option><option>Dobry</option><option>Średni</option><option>Słaby</option></select></label>
 <label>Kod kreskowy / ISBN<input id="nbarcode" inputmode="numeric"></label>
 </div>
 <label>Notatka<textarea id="nnotes"></textarea></label>
 <label>Okładka – wybierz zdjęcie z telefonu<input id="ncover" type="file" accept="image/*"></label><div id="coverPreview"></div>
 <button id="saveItemBtn">💾 Zapisz</button><button type="button" class="secondary" onclick="cancelEdit()">Anuluj</button>
 </form></div>`;
}
function renderCollectionSection(id){
 const type=id==='cds'?'CD':id==='tapes'?'Kaseta':'Książka';
 const sec=$(id);
 const items=d.filter(x=>x.type===type);
 sec.innerHTML=`<div class="topbar"><button onclick="goHome()">← Menu</button><h2>${type==='CD'?'💿':type==='Kaseta'?'📼':'📚'} ${type}</h2></div>
 <button onclick="toggleAddForm('${id}')">＋ Dodaj pozycję</button><div id="addPanel" class="hide">${itemForm(type)}</div>
 <input id="sectionQ" placeholder="🔎 Szukaj w ${type}..." oninput="renderSectionList('${id}')">
 <div class="toolbar"><label>Gatunek<select id="filterGenre" onchange="renderSectionList('${id}')"><option value="">Wszystkie gatunki</option>${[...new Set(items.map(x=>String(x.genre||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl')).map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}</select></label>
 <label>Rok<select id="filterYear" onchange="renderSectionList('${id}')"><option value="">Wszystkie lata</option>${[...new Set(items.map(x=>String(x.year||'').trim()).filter(Boolean))].sort((a,b)=>Number(a)-Number(b)).map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join('')}</select></label>
 <label>Okładka<select id="filterCover" onchange="renderSectionList('${id}')"><option value="">Wszystkie</option><option value="yes">Ze zdjęciem</option><option value="no">Bez zdjęcia</option></select></label>
 <label>Widok<select id="viewMode" onchange="renderSectionList('${id}')"><option value="list">Lista</option><option value="gallery">Galeria okładek</option></select></label></div>
 <div id="sectionList"></div>`;
 renderSectionList(id);
}
function authorSurname(name){
 const s=String(name||'').trim();
 if(!s)return '';
 if(s.includes(','))return s.split(',')[0].trim();
 const parts=s.split(/\\s+/).filter(Boolean);
 return parts.length>1?parts[parts.length-1]:s;
}
function sortCollection(items,type){
 return items.slice().sort((a,b)=>{
  const ka=type==='Książka'?authorSurname(a.creator):String(a.creator||'').trim();
  const kb=type==='Książka'?authorSurname(b.creator):String(b.creator||'').trim();
  const byCreator=ka.localeCompare(kb,'pl',{sensitivity:'base',numeric:true});
  if(byCreator!==0)return byCreator;
  const ya=Number.parseInt(a.year,10), yb=Number.parseInt(b.year,10);
  const hasYa=Number.isFinite(ya)&&ya>0, hasYb=Number.isFinite(yb)&&yb>0;
  if(hasYa&&hasYb&&ya!==yb)return ya-yb;
  if(hasYa!==hasYb)return hasYa?-1:1;
  return String(a.title||'').localeCompare(String(b.title||''),'pl',{sensitivity:'base',numeric:true});
 });
}
function renderSectionList(id){
 const type=id==='cds'?'CD':id==='tapes'?'Kaseta':'Książka';
 const q=(($('sectionQ')||{}).value||'').toLowerCase();
 const genre=$('filterGenre')?.value||'',year=$('filterYear')?.value||'',cover=$('filterCover')?.value||'';
 const found=d.filter(x=>x.type===type && (x.title+' '+x.creator+' '+x.genre+' '+x.barcode+' '+x.notes).toLowerCase().includes(q) && (!genre||x.genre===genre) && (!year||String(x.year)===year) && (!cover||(cover==='yes'?Boolean(x.cover):!x.cover))); 
 const arr=sortCollection(found,type);
 $('sectionList').classList.toggle('gallery',$('viewMode')?.value==='gallery');
 $('sectionList').innerHTML=arr.map(x=>itemHTML(x)).join('')||'<p>Brak pozycji.</p>';hydrateCovers($('sectionList'));
}
function itemHTML(x){
 const main=esc(x.creator||'Brak autora/wykonawcy');
 const title=esc(x.title||'Bez tytułu');
 return `<div class="item"><div class="row">${coverHTML(x.cover)}<div class="itemtext"><b>${main}</b><br><span class="muted">${title}</span><br>${esc(x.type)} ${x.year?'• '+esc(x.year):''}<br>${esc(x.genre)} ${x.barcode?'• '+esc(x.barcode):''}${x.notes?`<br><small>📝 ${esc(x.notes)}</small>`:''}</div></div><div class="itemactions"><button onclick="editItem(${x.id})">✏️ Edytuj</button><button class="danger" onclick="del(${x.id})">Usuń</button></div></div>`;
}
let editingId=null;
function toggleAddForm(id){const panel=$('addPanel');panel.classList.toggle('hide');if(!panel.classList.contains('hide')){editingId=null;resetItemForm();}}
function resetItemForm(){const form=$('addPanel')?.querySelector('form');if(form)form.reset();$('coverPreview').innerHTML='';$('saveItemBtn').textContent='💾 Zapisz';const heading=$('addPanel')?.querySelector('h3');if(heading)heading.textContent='➕ Dodaj '+currentType;}
function cancelEdit(){editingId=null;resetItemForm();$('addPanel').classList.add('hide');}
function editItem(id){const x=d.find(a=>a.id==id);if(!x)return;editingId=id;$('addPanel').classList.remove('hide');const heading=$('addPanel').querySelector('h3');if(heading)heading.textContent='✏️ Edytuj pozycję';$('ntitle').value=x.title||'';$('ncreator').value=x.creator||'';$('nyear').value=x.year||'';$('npub').value=x.publisher||'';$('ngenre').value=x.genre||'';$('ncondition').value=x.condition||'Bardzo dobry';$('nbarcode').value=x.barcode||'';$('nnotes').value=x.notes||'';$('saveItemBtn').textContent='💾 Zapisz zmiany';$('coverPreview').innerHTML=x.cover?`${coverHTML(x.cover)}<button type="button" class="secondary" onclick="removeCover()">Usuń okładkę</button>`:'';hydrateCovers($('coverPreview'));requestAnimationFrame(()=> $('addPanel').scrollIntoView({behavior:'smooth',block:'start'}));}
function removeCover(){if(editingId){const x=d.find(a=>a.id==editingId);if(x)x.cover='';}$('coverPreview').innerHTML='';}
const COVER_DB='moja_kolekcja_okladki_v1';
let coverDbPromise;
const coverUrls=new Map();
function coverHTML(value){
 if(!value)return '';
 if(String(value).startsWith('idb:'))return `<img class="cover" data-cover-key="${esc(String(value).slice(4))}" loading="lazy" onerror="this.style.display='none'">`;
 return `<img class="cover" src="${esc(value)}" loading="lazy" onerror="this.style.display='none'">`;
}
function openCoverDB(){
 if(!coverDbPromise)coverDbPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open(COVER_DB,1);
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('covers'))req.result.createObjectStore('covers');};
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
 return coverDbPromise;
}
async function putCover(key,blob){
 const db=await openCoverDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('covers','readwrite');tx.objectStore('covers').put(blob,String(key));
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error);
 });
}
async function getCover(key){
 const db=await openCoverDB();
 return new Promise((resolve,reject)=>{
  const req=db.transaction('covers','readonly').objectStore('covers').get(String(key));
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
}
async function hydrateCovers(container){
 if(!container)return;
 for(const img of container.querySelectorAll('img[data-cover-key]')){
  try{
   const key=img.dataset.coverKey;let url=coverUrls.get(key);
   if(!url){const blob=await getCover(key);if(!blob)continue;url=URL.createObjectURL(blob);coverUrls.set(key,url);}
   if(img.isConnected)img.src=url;
  }catch(e){console.warn('Okładka:',e);}
 }
}
let migrating=false;
async function migrateCovers(){
 if(migrating)return;
 const pending=d.filter(x=>typeof x.cover==='string'&&x.cover.startsWith('data:image/'));
 if(!pending.length)return;
 migrating=true;
 try{
  const updates=[];
  for(const x of pending){const blob=await(await fetch(x.cover)).blob();await putCover(x.id,blob);updates.push({id:x.id,original:x.cover});}
  // Aktualizuj dopiero po udanym zapisie wszystkich obrazów.
  for(const u of updates){const x=d.find(x=>x.id===u.id);if(x&&x.cover===u.original)x.cover='idb:'+u.id;}
  save();
  if(!$('home').classList.contains('hide'))renderMenu();
  else for(const id of ['cds','tapes','books'])if(!$(id).classList.contains('hide'))renderCollectionSection(id);
 }catch(err){console.warn('Migracja nie powiodła się',err);}
 finally{migrating=false;}
}
async function readCover(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();r.onerror=()=>reject(new Error('Nie można odczytać zdjęcia'));
  r.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Nie można otworzyć zdjęcia'));
   img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,700/Math.max(img.width,img.height));
    c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>b?resolve(b):reject(new Error('Błąd zdjęcia')),'image/jpeg',0.78);
   };img.src=r.result;};r.readAsDataURL(file);
 });
}
async function addItem(e,type){
 e.preventDefault();const btn=$('saveItemBtn');btn.disabled=true;
 try{
  // Migracja zmniejsza zajętość localStorage przed zapisem nowych pozycji.
  await migrateCovers();
  const old=editingId?d.find(x=>x.id==editingId):null;
  const id=old?.id||Date.now();let cover=old?.cover||'';
  const file=$('ncover').files[0];
  if(file){await putCover(id,await readCover(file));cover='idb:'+id;
   const cached=coverUrls.get(String(id));if(cached){URL.revokeObjectURL(cached);coverUrls.delete(String(id));}
  }
  const obj=clean({id,type,title:$('ntitle').value,creator:$('ncreator').value,year:$('nyear').value,publisher:$('npub').value,genre:$('ngenre').value,condition:$('ncondition').value,notes:$('nnotes').value,barcode:$('nbarcode').value,cover});
  const previous=d;
  d=editingId?d.map(x=>x.id==editingId?obj:x):[...d,obj];
  try{save();}catch(err){d=previous;throw err;}
  renderCollectionSection(type==='CD'?'cds':type==='Kaseta'?'tapes':'books');
 }catch(err){console.error(err);alert('Nie udało się zapisać zdjęcia lub pozycji. Dane kolekcji pozostały zachowane.');}
 finally{const b=$('saveItemBtn');if(b)b.disabled=false;}
}
function del(id){if(!confirm('Usunąć tę pozycję?'))return;d=d.filter(x=>x.id!=id);save();const section=['cds','tapes','books'].find(id=>!$(id).classList.contains('hide'));if(section)renderCollectionSection(section);else if(!$('search').classList.contains('hide'))renderGlobal();}
function renderWanted(){
 wantedEditingId=null;
 $('wanted').innerHTML=`<div class="topbar"><button onclick="goHome()">← Menu</button><h2>🛒 Do kupienia</h2></div>
 <form onsubmit="addWanted(event)"><div class="grid">
 <label>Rodzaj<select id="wt"><option>CD</option><option>Kaseta</option><option>Książka</option></select></label>
 <label>Tytuł<input id="wti" required></label><label>Wykonawca / autor<input id="wcr"></label>
 <label>Rok<input id="wyr" type="number"></label><label>Maks. cena (€)<input id="wp" type="number"></label>
 <label>Priorytet<select id="pr"><option>⭐⭐⭐⭐⭐</option><option>⭐⭐⭐⭐</option><option>⭐⭐⭐</option><option>⭐⭐</option><option>⭐</option></select></label>
 </div><button>🛒 Dodaj</button></form>
 <div class="toolbar"><label>Filtruj rodzaj<select id="wfilter" onchange="renderWantedList()"><option value="">Wszystkie</option><option>CD</option><option>Kaseta</option><option>Książka</option></select></label><label>Sortowanie<select id="wsort" onchange="renderWantedList()"><option value="priority">Priorytet</option><option value="az">Wykonawca / autor A–Z</option><option value="price">Najniższa cena</option></select></label></div>
 <input id="wq" placeholder="🔎 Szukaj..." oninput="renderWantedList()"><div id="wl"></div>`;
 renderWantedList();
}
function addWanted(e){e.preventDefault();const obj={id:wantedEditingId||Date.now(),type:$('wt').value,title:$('wti').value,creator:$('wcr').value,year:$('wyr').value,price:$('wp').value,prio:$('pr').value};w=wantedEditingId?w.map(x=>x.id==wantedEditingId?obj:x):[...w,obj];wantedEditingId=null;save();renderWanted()}
function renderWantedList(){
 const q=(($('wq')||{}).value||'').toLowerCase();
 const kind=$('wfilter')?.value||'';
 const arr=w.filter(x=>(x.title+' '+x.creator+' '+x.type).toLowerCase().includes(q)&&(!kind||x.type===kind)).sort((a,b)=>{const mode=$('wsort')?.value;if(mode==='az')return String(a.creator).localeCompare(String(b.creator),'pl');if(mode==='price')return (Number(a.price)||Infinity)-(Number(b.price)||Infinity);return String(b.prio||'').length-String(a.prio||'').length;});
 $('wl').innerHTML=arr.map(x=>`<div class="item"><div><b>${esc(x.creator||'Brak autora/wykonawcy')}</b><br><span class="muted">${esc(x.title||'Bez tytułu')}</span><br>${esc(x.type)} ${x.year?'• '+x.year:''}<br>${x.prio||'⭐⭐⭐'} ${x.price?'• max '+x.price+' €':''}</div><div><button onclick="searchWanted(${x.id})">🔎 Szukaj</button><button onclick="editWanted(${x.id})">✏️ Edytuj</button><button class="buy" onclick="buy(${x.id})">✓ Kupione</button><button class="danger" onclick="dw(${x.id})">Usuń</button></div></div>`).join('')||'<p>Lista pusta.</p>';
}
function editWanted(id){
 const x=w.find(a=>a.id==id);if(!x)return;
 $('wt').value=x.type;$('wti').value=x.title;$('wcr').value=x.creator;$('wyr').value=x.year;$('wp').value=x.price;$('pr').value=x.prio;
 wantedEditingId=id;
 const form=$('wt').closest('form');form.scrollIntoView({behavior:'smooth',block:'start'});
 form.querySelector('button').textContent='💾 Zapisz zmiany';
}
let wantedEditingId=null;
function dw(id){w=w.filter(x=>x.id!=id);save();renderWanted()}
function searchWanted(id){const x=w.find(a=>a.id==id);location.href='https://www.google.com/search?q='+encodeURIComponent([x.title,x.creator,x.year,x.type,'kupić'].filter(Boolean).join(' '))}
function buy(id){const x=w.find(a=>a.id==id);d.push(clean(x));w=w.filter(x=>x.id!=id);save();renderWanted()}
function renderGlobal(){
 const q=(($('globalQ')||{}).value||'').toLowerCase();
 const found=d.filter(x=>(x.title+' '+x.creator+' '+x.genre+' '+x.barcode+' '+x.notes+' '+x.type).toLowerCase().includes(q));
 const arr=[
  ...sortCollection(found.filter(x=>x.type==='CD'),'CD'),
  ...sortCollection(found.filter(x=>x.type==='Kaseta'),'Kaseta'),
  ...sortCollection(found.filter(x=>x.type==='Książka'),'Książka')
 ];
 $('globalList').innerHTML=arr.map(itemHTML).join('')||'<p>Brak wyników.</p>';hydrateCovers($('globalList'));
}
async function startScan(){
 const video=$('scannerVideo'), msg=$('scanMsg');
 if(!navigator.mediaDevices?.getUserMedia){
  alert('Chrome nie udostępnia aparatu tej stronie. Otwórz aplikację przez HTTPS.');
  return;
 }
 try{
  try{
   scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){
   scanStream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
  }
  $('scanArea').classList.remove('hide');
  video.muted=true;
  video.playsInline=true;
  video.srcObject=scanStream;
  await video.play();
  msg.textContent='📷 Aparat działa. Skieruj go na kod kreskowy…';

  // Nie zatrzymujemy aparatu, jeśli BarcodeDetector jest dostępny w Chrome,
  // ale jego konstruktor nie obsługuje danego urządzenia.
  if(!('BarcodeDetector' in window) || typeof BarcodeDetector!=='function'){
   msg.textContent='📷 Aparat działa. Automatyczne skanowanie nie jest dostępne — wpisz kod ręcznie.';
   return;
  }

  let detector=null;
  try{
   const supported=typeof BarcodeDetector.getSupportedFormats==='function'
    ? await BarcodeDetector.getSupportedFormats() : [];
   const wanted=['ean_13','ean_8','upc_a','upc_e','code_128'];
   const formats=wanted.filter(f=>supported.includes(f));
   detector=formats.length ? new BarcodeDetector({formats}) : new BarcodeDetector();
  }catch(e){
   detector=null;
  }

  if(!detector){
   msg.textContent='📷 Aparat działa. Automatyczne skanowanie nie jest dostępne na tym telefonie — wpisz kod ręcznie.';
   return;
  }

  const loop=async()=>{
   if(!scanStream)return;
   try{
    const codes=await detector.detect(video);
    if(codes.length){
     $('scanCode').value=codes[0].rawValue||'';
     stopScan();
     await lookupBarcode();
     return;
    }
   }catch(e){}
   scanTimer=setTimeout(loop,400);
  };
  loop();
 }catch(e){
  stopScan();
  const n=e?.name||'UnknownError';
  if(n==='NotAllowedError') alert('Android/Chrome odrzucił dostęp do aparatu. Sprawdź uprawnienie strony i globalny „Dostęp do aparatu”.');
  else if(n==='NotFoundError') alert('Nie znaleziono aparatu w telefonie.');
  else if(n==='NotReadableError'||n==='TrackStartError') alert('Aparat jest obecnie zajęty. Zamknij aplikację Aparat i inne aplikacje używające kamery.');
  else alert('Nie udało się uruchomić aparatu. Kod błędu: '+n);
 }
}
function stopScan(){if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}if($('scannerVideo'))$('scannerVideo').srcObject=null;if($('scanArea'))$('scanArea').classList.add('hide')}
async function lookupBarcode(){
 const code=($('scanCode').value||'').replace(/[^0-9Xx]/g,'');if(!code)return;
 $('scanMsg').textContent='🔎 Szukam informacji dla kodu '+code+'…';
 $('scanResult').innerHTML='';
 try{
  const type=$('scanType').value;
  if(type==='Książka'&&(code.length===10||code.length===13)){
   const r=await fetch('https://openlibrary.org/isbn/'+encodeURIComponent(code)+'.json');
   if(r.ok){const b=await r.json();showScanResult({type,title:b.title||'',creator:(b.authors||[]).map(a=>a.name).join(', '),year:(b.publish_date||'').match(/(\\d{4})/)?.[1]||'',publisher:(b.publishers||[])[0]?.name||'',cover:'https://covers.openlibrary.org/b/isbn/'+encodeURIComponent(code)+'-M.jpg',barcode:code});return}
  }
  const r=await fetch('https://musicbrainz.org/ws/2/release/?query='+encodeURIComponent('barcode:'+code)+'&fmt=json&limit=5',{headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error();
  const j=await r.json();
  if(j.releases?.length){const x=j.releases[0];showScanResult({type,title:x.title||'',creator:(x['artist-credit']||[]).map(a=>a.name||a.artist?.name).join(', '),year:(x.date||'').slice(0,4),publisher:(x['label-info']||[])[0]?.label?.name||'',genre:x['release-group']?.['primary-type']||'',cover:x.id?'https://coverartarchive.org/release/'+x.id+'/front-250':'',barcode:code});return}
  $('scanMsg').textContent='Nie znalazłem tego kodu. Kod pozostaje zapisany poniżej — możesz użyć go ręcznie.';
 }catch(e){$('scanMsg').textContent='Nie udało się pobrać danych. Kod jest odczytany; możesz wpisać dane ręcznie.'}
}
function showScanResult(x){
 $('scanMsg').textContent='✅ Znaleziono dane. Sprawdź je i dodaj do kolekcji.';
 $('scanResult').innerHTML=`<div class="apiresult">${x.cover?`<img src="${esc(x.cover)}" onerror="this.style.display='none'">`:''}<b>${esc(x.title)||'Brak tytułu'}</b><br>${esc(x.creator)} ${x.year?'• '+esc(x.year):''}<br><button onclick='saveScanned(${JSON.stringify(x).replace(/'/g,"&#39;")})'>💾 Dodaj do kolekcji</button></div>`;
}
function saveScanned(x){
 d.push(clean(x));save();$('scanResult').innerHTML='<div class="panel">✅ Dodano do kolekcji.</div>';
}
async function exp(){
 try{
  const collection=[];
  for(const x of d){const item={...x};
   if(String(item.cover||'').startsWith('idb:')){
    const blob=await getCover(String(item.cover).slice(4));
    if(!blob)throw new Error('Brak zdjęcia: '+item.title);
    item.cover=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob);});
   }
   collection.push(item);
  }
  const blob=new Blob([JSON.stringify({version:8,collection,wanted:w},null,2)],{type:'application/json'});
  const a=document.createElement('a');const url=URL.createObjectURL(blob);
  a.href=url;a.download='moja_kolekcja_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);
 }catch(err){console.error(err);alert('Nie udało się przygotować pełnej kopii zapasowej.');}
}
$('imp').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const o=JSON.parse(await f.text());
  if(!Array.isArray(o.collection))throw new Error('Nieprawidłowy format');
  if(!confirm('Import zastąpi obecną kolekcję i listę zakupów danymi z pliku. Czy na pewno chcesz kontynuować?'))return;
  const incoming=o.collection.map(clean);
  // Kopiuj zdjęcia przed podmianą wpisów, aby nie utracić danych.
  for(const x of incoming){
   if(typeof x.cover==='string'&&x.cover.startsWith('data:image/')){
    const blob=await(await fetch(x.cover)).blob();await putCover(x.id,blob);x.cover='idb:'+x.id;
   }
  }
  const previousD=d,previousW=w;
  d=incoming;w=o.wanted||[];
  try{save();}catch(err){d=previousD;w=previousW;throw err;}
  alert('Zaimportowano dane i okładki.');
 }catch(err){console.error(err);alert('Nie udało się zaimportować kopii. Dotychczasowe dane pozostały zachowane.');}
};
$('globalQ').oninput=renderGlobal;
load();renderMenu();migrateCovers();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
